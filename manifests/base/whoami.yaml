# =============================================================================
# DEPLOYMENT — whoami
# =============================================================================
# Runs traefik/whoami — a lightweight HTTP server that echoes request headers,
# IP addresses, and routing information back to the client.
#
# Use cases:
#   - Verify Ingress path routing is working correctly
#   - Inspect headers forwarded by Nginx or Ingress controller
#   - Confirm which pod served the request (hostname in response)
#
# Access via Ingress: http://app.local/whoami
#
# Apply:  kubectl apply -f manifests/base/whoami-deployment.yaml
# Verify: kubectl get pods -l app=whoami -n assign1
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: assign1
  labels:
    app: whoami
    project: kubernetes-assignment-1
spec:
  replicas: 2   # two replicas to demonstrate load balancing via Ingress
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"

---
# =============================================================================
# SERVICE — whoami
# =============================================================================
# Exposes whoami pods inside the cluster.
# Referenced directly by the Ingress for the /whoami path.
#
# Apply:  kubectl apply -f manifests/base/whoami-deployment.yaml
# Verify: kubectl get svc whoami -n assign1
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: assign1
  labels:
    app: whoami
    project: kubernetes-assignment-1
spec:
  type: ClusterIP
  selector:
    app: whoami
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP

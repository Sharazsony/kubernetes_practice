# =============================================================================
# CONFIGMAP — nginx-config
# =============================================================================
# Stores the Nginx reverse-proxy configuration.
# Mounted into the Nginx Deployment as a single file via subPath.
#
# Mount path: /etc/nginx/conf.d/default.conf
#   - Nginx automatically loads all *.conf files from /etc/nginx/conf.d/
#   - subPath ensures only THIS file is mounted, preserving other nginx files
#     (mime.types, fastcgi_params, etc.) — without subPath the whole folder
#     would be replaced and nginx would crash.
#
# Routing rules defined here:
#   /api/     → proxy to backend Service (podinfo) on port 9898
#   /whoami/  → proxy to whoami Service on port 80
#   /         → serve static HTML from /usr/share/nginx/html (ConfigMap mount)
#
# Apply:  kubectl apply -f manifests/base/configmap-nginx.yaml
# Verify: kubectl exec deploy/nginx -n assign1 -- cat /etc/nginx/conf.d/default.conf
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: assign1
  labels:
    app: nginx
    project: kubernetes-assignment-1
data:
  nginx.conf: |
    server {
        listen 80;
        server_name _;  # accept any hostname or IP

        # ── Route: /api/ → podinfo backend ──────────────────────────────────
        # Strips the /api/ prefix before forwarding to podinfo.
        # Example: GET /api/version → http://backend:9898/version
        location /api/ {
            proxy_pass         http://backend:9898/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Route: /whoami/ → whoami service ────────────────────────────────
        # Strips the /whoami/ prefix before forwarding to whoami.
        # Example: GET /whoami/ → http://whoami:80/
        location /whoami/ {
            proxy_pass         http://whoami:80/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Route: / → static HTML page ─────────────────────────────────────
        # Serves the static index.html from the static-content ConfigMap mount.
        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }
    }

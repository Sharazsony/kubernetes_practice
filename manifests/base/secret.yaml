# =============================================================================
# SECRET — app-secret
# =============================================================================
# Stores sensitive values as base64-encoded strings.
# Type Opaque = generic key-value secret (not TLS, not service account).
#
# Usage in nginx Deployment:
#   1. ENV VAR  → valueFrom.secretKeyRef  (API_KEY env variable)
#   2. VOLUME   → volumeMount at /etc/secret (mounted as file)
#
# Decode values for verification (do NOT commit real secrets to git):
#   echo "bXlhcGlrZXk=" | base64 -d   → myapikey
#   echo "bXlwYXNzd29yZA==" | base64 -d → mypassword
#
# Apply:  kubectl apply -f manifests/base/secret.yaml
# Verify: kubectl get secret app-secret -n assign1
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: assign1
  labels:
    app: nginx
    project: kubernetes-assignment-1
type: Opaque
data:
  # base64 encoded values — use `echo -n "value" | base64` to generate
  api-key: bXlhcGlrZXk=        # "myapikey"
  db-password: bXlwYXNzd29yZA== # "mypassword"
